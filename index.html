<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Special Message For You ❤️</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>


    <div id="app">
        <!-- STEP 1: WELCOME SCREEN -->
        <section id="step1" class="screen active">
            <div class="card glass">
                <div class="heart-photo-container pulse">
                    <img src="images/Screenshot 2569-05-17 at 11.21.00 AM.png" alt="Our Photo" class="heart-photo">
                </div>
                <h1 class="title">Jîñg Jîñg ❤️</h1>
                <p class="question">ကိုတို့ ပထမဆုံး တွေ့ခဲ့တဲ့နေ့က ဘယ်နေ့လဲ?</p>
                <div class="input-group">
                    <input type="date" id="verificationDate" class="custom-input">
                    <button id="unlockBtn" class="primary-btn">Go!✨</button>
                </div>
                <p id="errorMsg" class="error-text hidden">Date မှားနေတယ်နော်၊ ပြန်စဉ်းစားကြည့်ပါဦး... 🥺</p>
            </div>
        </section>

        <!-- STEP 2: OUR TIMELINE -->
        <section id="step2" class="screen hidden">
            <div class="timeline-container">
                <div class="timeline-item">
                    <div class="timeline-card glass">
                        <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=600&auto=format&fit=crop" alt="Memory 1" class="timeline-img" loading="lazy">
                        <p class="typewriter" data-text="အရာအားလုံးက ဒီကနေ စခဲ့တာပေါ့..."></p>
                    </div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-card glass">
                        <img src="https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?q=80&w=600&auto=format&fit=crop" alt="Memory 2" class="timeline-img" loading="lazy">
                        <p class="typewriter" data-text="အတူတူ ဖြတ်သန်းခဲ့တဲ့ အချိန်တိုင်းက တန်ဖိုးရှိပါတယ်..."></p>
                    </div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-card glass">
                        <img src="https://images.unsplash.com/photo-1516589174184-c6858b16ecb0?q=80&w=600&auto=format&fit=crop" alt="Memory 3" class="timeline-img" loading="lazy">
                        <p class="typewriter" data-text="နင့်အနားမှာ ရှိနေရတာ ငါ့အတွက် အပျော်ဆုံးပဲ..."></p>
                    </div>
                </div>
                <div class="timeline-item">
                    <button id="nextToProposal" class="primary-btn pulse">Continue to Forever... ✨</button>
                </div>
            </div>
        </section>

        <!-- STEP 3: THE PROPOSAL -->
        <section id="step3" class="screen hidden">
            <div class="card glass">
                <h1 class="title main-question">Will you be my girlfriend? 💍</h1>
                <div class="action-buttons">
                    <button id="yesBtn" class="primary-btn celebration-btn">Yes! ❤️</button>
                    <button id="noBtn" class="secondary-btn">No 😢</button>
                </div>
            </div>
        </section>

        <!-- CELEBRATION OVERLAY -->
        <div id="celebration" class="screen hidden celebration-screen">
            <div class="celebration-content">
                <h1 class="title huge">I Love You! ❤️</h1>
                <p class="sub-text">You've made me the happiest person in the world!</p>
                <div class="heart-container"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
