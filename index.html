<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Special Message For You ❤️</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>


    <div id="app">
        <!-- STEP 1: WELCOME SCREEN -->
        <section id="step1" class="screen active">
            <div class="card glass">
                <div class="heart-photo-container pulse">
                    <img src="images/Screenshot 2569-05-17 at 11.21.00 AM.png" alt="Our Photo" class="heart-photo">
                </div>
                <h1 class="title">Jîñg Jîñg ❤️</h1>
                <p class="question">ကိုတို့ ပထမဆုံး တွေ့ခဲ့တဲ့နေ့က ဘယ်နေ့လဲ?</p>
                <div class="input-group">
                    <input type="date" id="verificationDate" class="custom-input">
                    <button id="unlockBtn" class="primary-btn">Go!✨</button>
                </div>
                <p id="errorMsg" class="error-text hidden">Date မှားနေတယ်နော်၊ ပြန်စဉ်းစားကြည့်ပါဦး... 🥺</p>
            </div>
        </section>

        <!-- STEP 2: OUR TIMELINE -->
        <section id="step2" class="screen hidden">
            <div class="timeline-container">
                <div class="timeline-item">
                    <div class="timeline-card glass">
                        <img src="images/678646466_122175175616831438_6068572051895299790_n.jpg" alt="Memory 1" class="timeline-img" loading="lazy">
                        <p class="typewriter" data-text="အကို အမှန်တိုင်းဝန်ခံရရင် ညီမကို လိုင်းပေါ်မှာ စတွေ့တုန်းက သဘောကျနေတာ မဟုတ်သေးပါဘူး။ ဒီတိုင်းပဲ အပြင်မှာတွေ့ချင်လို့ ချိန်းလိုက်တာပါ။"></p>
                    </div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-card glass">
                        <p class="typewriter" data-text="ဒါပေမယ့် တွေ့တဲ့နေ့မှာပဲ ညီမကိုသဘောကျသွားတာ ☺️💖"></p>
                    </div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-card glass">
                        <p class="typewriter" data-text="အကို အဲ့နေ့က နည်းနည်းနောက်ကျမယ်ပြောပေမယ့် အကို့အတွက်အအေးတောင်ဝယ်လာပေးသေးတယ်။ ကားမှတ်တိုင်မှာ စတွေ့တော့ ညီမက ပြေးလာပြီးလက်ပြနေတာတွေ့တယ်။ အဲ့ပုံလေးက ချစ်ဖို့ကောင်းတယ်။ ပြီးတော့အကိုကချက်ချင်းမမှတ်မိဘူး mask လဲ တပ်ထားတယ် ဆံပင်လဲစီးထားတယ်ဆိုတော့😅"></p>
                    </div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-card glass">
                        <p class="typewriter" data-text="အကို အဲ့နေ့က ဓာတ်ပုံလဲကောင်းကောင်းမရိုက်ပေးဖြစ်ဘူး(အကိုကဓာတ်ပုံ သိပ်မရိုက်တတ်ဘူး😢)"></p>
                    </div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-card glass">
                        <p class="typewriter" data-text="တကယ်က ဒီ website မှာ ညီမနဲ့အတူရှိခဲ့တဲ့အမှတ်တရတွေပုံတွေနဲ့လုပ်ချင်ပေမယ့် ဘာမှမရှိသေးတော့ စာတွေပဲရေးထည့်လိုက်တာ😅။ နောက်တော့မှ ပုံတွေအမှတ်တရတွေ ထပ်ဖြည့်ပြီး တူတူလုပ်ကြမယ်နော်💖"></p>
                    </div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-card glass">
                        <p class="typewriter" data-text="တကယ်ပြောချင်တာက အခုမှပါ😅"></p>
                    </div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-card glass">
                        <p class="typewriter" data-text="အကိုတို့တွဲနေတယ်ဆိုပေမယ့် အကိုသေချာလဲမပြောရသေးသလို ညီမလဲသေချာမဖြေမပေးရသေးဘူးဟုတ်တယ်ဟုတ်?☺️။
                        အကိုညီမကိုတကယ်သဘောကျပြီးတွဲလဲတွဲချင်ပါတယ်💖 နောက်ပိုင်းလဲအဆင်ပြေအောင်ကြိုးစားပါမယ်"></p>
                    </div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-card glass">
                        <p class="typewriter" data-text="ညီမကိုဝမ်းနည်းအောင်လဲမလုပ်ဘဲနဲ့ ပျော်အောင်လဲထားပါမယ်။
                        ပြီးတော့ ညီမလိုချင်တဲ့အတိုင်းလဲ ဂရုစိုက်မယ်နော်😘"></p>
                        <button id="nextToProposal" class="primary-btn pulse">Continue...💖 </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- STEP 3: THE PROPOSAL -->
        <section id="step3" class="screen hidden">
            <div class="card glass">
                <h1 class="title main-question">ဒါဆို....ကိုကို့ ကောင်မလေး ဖြစ်ပေးမှာလား? 💖</h1>
                <div class="action-buttons">
                    <button id="yesBtn" class="primary-btn celebration-btn">Yes! ❤️</button>
                    <button id="noBtn" class="secondary-btn">No 😢</button>
                </div>
            </div>
        </section>

        <!-- CELEBRATION OVERLAY -->
        <div id="celebration" class="screen hidden celebration-screen">
            <div class="celebration-content">
                <h1 class="title huge">အရမ်းချစ်တယ်...နော် ❤️</h1>
                <p class="sub-text">ကိုတို့ အဆင်ပြေပြေ တွဲကြမယ်နော် 😘💖</p>
                <div class="heart-container"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
